; PHP-FPM Pool Configuration for Railway
; Running as root user

[www]
user = root
group = root

listen = 127.0.0.1:9000
listen.owner = root
listen.group = root

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Logging
access.log = /dev/stdout
slowlog = /dev/stderr
request_slowlog_timeout = 10s

; Environment
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

; Security
security.limit_extensions = .php
